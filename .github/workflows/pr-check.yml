name: PR Quality Check

on:
  pull_request:
    branches:
      - main

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print message
        run: echo "CI is running"

      - name: Run script
        run: ./scripts/backup_logs.sh
